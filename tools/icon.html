<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05060f}canvas{display:block}</style></head>
<body><canvas id="c" width="512" height="512"></canvas>
<script>
var c = document.getElementById('c'), g = c.getContext('2d');
var S = 512, cx = S / 2, cy = S / 2;

/* backdrop */
var bg = g.createRadialGradient(cx, cy * 0.9, 20, cx, cy, S * 0.72);
bg.addColorStop(0, '#141033');
bg.addColorStop(0.55, '#0a0920');
bg.addColorStop(1, '#04050c');
g.fillStyle = bg; g.fillRect(0, 0, S, S);

/* stars */
for (var i = 0; i < 90; i++) {
  g.fillStyle = 'rgba(200,230,255,' + (0.1 + Math.random() * 0.5).toFixed(2) + ')';
  g.fillRect(Math.random() * S, Math.random() * S, 1.6, 1.6);
}

/* asteroid */
function rock(cxp, cyp, r, rot, type) {
  var n = 11, pts = [];
  for (var k = 0; k < n; k++) {
    var a = (k / n) * Math.PI * 2 + rot, rr = r * (0.78 + ((k * 37) % 30) / 100);
    pts.push([cxp + Math.cos(a) * rr, cyp + Math.sin(a) * rr]);
  }
  g.beginPath();
  pts.forEach(function (p, k) { k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
  g.closePath();
  g.fillStyle = type === 2 ? 'rgba(34,12,6,0.96)' : 'rgba(12,18,34,0.96)';
  g.fill();
  var col = type === 2 ? '#ff8a3d' : '#7df9ff';
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = col; g.globalAlpha = 0.30; g.lineWidth = 26; g.stroke();
  g.restore();
  g.strokeStyle = type === 2 ? '#ffd08a' : '#bff7ff';
  g.lineWidth = 9; g.lineJoin = 'round'; g.stroke();
  /* craters */
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = type === 2 ? 'rgba(255,160,80,0.55)' : 'rgba(120,220,255,0.5)';
  g.lineWidth = 5;
  for (var q = 0; q < 3; q++) {
    g.beginPath();
    g.arc(cxp + Math.cos(q * 2.1) * r * 0.34, cyp + Math.sin(q * 2.1) * r * 0.34, r * (0.1 + q * 0.045), 0, Math.PI * 2);
    g.stroke();
  }
  g.restore();
}

rock(cx - 26, cy + 44, 150, 0.5, 2);
rock(cx + 128, cy - 96, 74, 1.7, 0);

/* ship */
g.save();
g.translate(cx + 46, cy - 150);
g.rotate(-0.5);
var r = 58;
/* engine glow */
g.save();
g.globalCompositeOperation = 'lighter';
var fg = g.createLinearGradient(-r * 0.7, 0, -r * 2.4, 0);
fg.addColorStop(0, 'rgba(255,255,255,0.95)');
fg.addColorStop(0.5, 'rgba(125,249,255,0.55)');
fg.addColorStop(1, 'rgba(125,80,255,0)');
g.fillStyle = fg;
g.beginPath(); g.moveTo(-r * 0.7, r * 0.38); g.lineTo(-r * 2.5, 0); g.lineTo(-r * 0.7, -r * 0.38); g.closePath(); g.fill();
g.restore();

g.beginPath();
g.moveTo(r * 1.55, 0); g.lineTo(-r * 0.92, r * 0.95); g.lineTo(-r * 0.42, 0); g.lineTo(-r * 0.92, -r * 0.95);
g.closePath();
g.fillStyle = 'rgba(6,16,26,0.95)'; g.fill();
g.save();
g.globalCompositeOperation = 'lighter';
g.strokeStyle = 'rgba(95,216,255,0.45)'; g.lineWidth = r * 0.5; g.stroke();
g.restore();
g.strokeStyle = '#eaffff'; g.lineWidth = r * 0.13; g.lineJoin = 'round'; g.stroke();
g.save();
g.globalCompositeOperation = 'lighter';
g.fillStyle = 'rgba(125,249,255,0.9)';
g.beginPath(); g.moveTo(r * 0.2, 0); g.lineTo(-r * 0.42, r * 0.26); g.lineTo(-r * 0.42, -r * 0.26); g.closePath(); g.fill();
g.restore();
g.restore();

/* impact sparks */
g.save();
g.globalCompositeOperation = 'lighter';
for (var s = 0; s < 22; s++) {
  var a = Math.random() * Math.PI * 2, d0 = 30 + Math.random() * 40, len = 12 + Math.random() * 46;
  g.strokeStyle = s % 3 ? 'rgba(255,190,120,0.9)' : 'rgba(255,255,255,0.9)';
  g.lineWidth = 2 + Math.random() * 2;
  g.beginPath();
  g.moveTo(cx + Math.cos(a) * d0, cy + 44 + Math.sin(a) * d0);
  g.lineTo(cx + Math.cos(a) * (d0 + len), cy + 44 + Math.sin(a) * (d0 + len));
  g.stroke();
}
var gl = g.createRadialGradient(cx, cy + 30, 0, cx, cy + 30, 190);
gl.addColorStop(0, 'rgba(255,220,180,0.55)');
gl.addColorStop(0.4, 'rgba(255,120,60,0.18)');
gl.addColorStop(1, 'rgba(255,80,40,0)');
g.fillStyle = gl; g.fillRect(0, 0, S, S);
g.restore();

/* vignette */
var vg = g.createRadialGradient(cx, cy, S * 0.3, cx, cy, S * 0.78);
vg.addColorStop(0, 'rgba(0,0,0,0)');
vg.addColorStop(1, 'rgba(0,0,0,0.55)');
g.fillStyle = vg; g.fillRect(0, 0, S, S);
</script></body></html>
